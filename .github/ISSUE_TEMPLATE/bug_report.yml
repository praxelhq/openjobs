name: Bug report
description: Report a reproducible OpenJobs defect
title: "Bug: "
labels: [bug]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include commands and a small fictional input. Remove secrets and personal data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit SHA
