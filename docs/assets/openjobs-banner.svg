<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">OpenJobs by Praxy Jobs</title>
  <desc id="desc">Find a job, see its source, and apply at the source. Open-source job discovery in Praxy's white, ink, and petrol blue palette.</desc>
  <rect width="1200" height="430" rx="24" fill="#FCFDFC"/>
  <rect x="1" y="1" width="1198" height="428" rx="23" fill="none" stroke="#D9E2E5" stroke-width="2"/>

  <g transform="translate(56 42)">
    <rect width="48" height="48" rx="13" fill="#0A5975"/>
    <circle cx="24" cy="24" r="15" fill="none" stroke="#FCFDFC" stroke-width="2"/>
    <path d="M17 31 31 17M21 17h10v10" fill="none" stroke="#FCFDFC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="34" fill="#15242B" font-family="Outfit, Avenir Next, Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="-1">openjobs</text>
  </g>
  <text x="1144" y="74" text-anchor="end" fill="#56646B" font-family="Outfit, Avenir Next, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="1.1">BY PRAXY JOBS</text>
  <path d="M56 108H1144" stroke="#D9E2E5" stroke-width="1.5"/>

  <g font-family="Outfit, Avenir Next, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-2.1">
    <text x="56" y="184" fill="#15242B">Find a job.</text>
    <text x="56" y="254" fill="#15242B">See its source.</text>
    <text x="56" y="324" fill="#0A5975">Apply at the source.</text>
  </g>
  <text x="58" y="380" fill="#56646B" font-family="Outfit, Avenir Next, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing=".2">OPEN-SOURCE JOB DISCOVERY  ·  ORIGINAL APPLICATION LINKS</text>

  <g transform="translate(850 132)" font-family="Outfit, Avenir Next, Arial, sans-serif">
    <rect width="294" height="233" rx="18" fill="#F3F6F7" stroke="#D9E2E5" stroke-width="1.5"/>
    <text x="24" y="37" fill="#56646B" font-size="13" font-weight="700" letter-spacing="1.3">THE PATH TO APPLY</text>
    <path d="M43 76V178" stroke="#B5CFD7" stroke-width="2"/>
    <circle cx="43" cy="79" r="13" fill="#E7F1F4" stroke="#0A5975" stroke-width="2"/>
    <circle cx="43" cy="128" r="13" fill="#E7F1F4" stroke="#0A5975" stroke-width="2"/>
    <circle cx="43" cy="177" r="13" fill="#0A5975"/>
    <path d="M38 177h10m-5-5 5 5-5 5" fill="none" stroke="#FCFDFC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="85" fill="#15242B" font-size="20" font-weight="600">Find a role</text>
    <text x="70" y="134" fill="#15242B" font-size="20" font-weight="600">See the source</text>
    <text x="70" y="183" fill="#0A5975" font-size="20" font-weight="700">Apply directly</text>
