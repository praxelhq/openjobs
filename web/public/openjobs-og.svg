<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OpenJobs — find the role, go to the employer</title>
  <desc id="desc">Cream and forest-green OpenJobs social preview with its circle-arrow mark and an original-application promise.</desc>
  <defs>
    <pattern id="grain" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".7" fill="#143f36" opacity=".08"/>
    </pattern>
    <clipPath id="canvas"><rect width="1200" height="630"/></clipPath>
  </defs>

  <g clip-path="url(#canvas)">
    <rect width="1200" height="630" fill="#f6f7f2"/>
    <rect width="1200" height="630" fill="url(#grain)"/>
    <path d="M0 490H1200V630H0Z" fill="#143f36"/>
    <path d="M71 125H1129" stroke="#dce2dc" stroke-width="2"/>

    <g transform="translate(71 53)" fill="none" stroke="#143f36" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="31" cy="31" r="29" stroke-width="3.5"/>
      <path d="M20 42 42 20M27 20h15v15" stroke-width="4"/>
    </g>
    <text x="152" y="99" fill="#172c28" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="-2.8">open<tspan font-weight="900">jobs</tspan></text>
    <text x="1129" y="91" text-anchor="end" fill="#456556" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2.2">OPEN SEARCH · ORIGINAL APPLICATIONS</text>

    <g font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="-4">
      <text x="70" y="255" fill="#172c28" font-size="86">Find the role.</text>
      <text x="70" y="355" fill="#427768" font-size="86">Go to the employer.</text>
    </g>
    <text x="73" y="423" fill="#5c6f66" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Real jobs. Clear sources. Free to browse.</text>

    <g transform="translate(1040 316)">
      <circle r="177" fill="none" stroke="#143f36" stroke-opacity=".07" stroke-width="65"/>
      <circle r="144" fill="none" stroke="#143f36" stroke-opacity=".12" stroke-width="2"/>
      <circle r="102" fill="#e8efdf" stroke="#143f36" stroke-opacity=".18" stroke-width="2"/>
      <circle r="65" fill="#143f36"/>
      <path d="M-29 29 29-29M-8-29h37V8" fill="none" stroke="#d8f77c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="0" cy="-144" r="6" fill="#64b168"/>
      <circle cx="144" cy="0" r="6" fill="#64b168"/>
      <circle cx="-144" cy="0" r="6" fill="#64b168"/>
    </g>

    <rect x="71" y="533" width="186" height="54" rx="27" fill="#d8f77c"/>
    <text x="164" y="567" text-anchor="middle" fill="#143f36" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">OPEN SOURCE</text>
    <text x="284" y="567" fill="#eff6ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500">Search from Praxy Jobs. Apply at the source.</text>
    <text x="1128" y="568" text-anchor="end" fill="#b8cebd" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">openjobs.praxyjobs.com</text>
  </g>
</svg>
