<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OpenJobs — find the role, go to the employer</title>
  <desc id="desc">An open-source job discovery preview in the Praxy candidate app's white, ink, and petrol blue design system.</desc>
  <rect width="1200" height="630" fill="#FCFDFC"/>
  <path d="M0 480H1200V630H0Z" fill="#F3F6F7"/>
  <path d="M72 130H1128" stroke="#D9E2E5" stroke-width="2"/>

  <g transform="translate(72 54)">
    <rect width="54" height="54" rx="14" fill="#0A5975"/>
    <circle cx="27" cy="27" r="17" fill="none" stroke="#FCFDFC" stroke-width="2.5"/>
    <path d="M19 35 35 19M24 19h11v11" fill="none" stroke="#FCFDFC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="38" fill="#15242B" font-family="Outfit, Avenir Next, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-1.7">openjobs</text>
  </g>
  <text x="1128" y="91" text-anchor="end" fill="#56646B" font-family="Outfit, Avenir Next, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="1.2">BY PRAXY JOBS</text>

  <g font-family="Outfit, Avenir Next, Arial, sans-serif" font-weight="700" letter-spacing="-3.3">
    <text x="70" y="270" fill="#15242B" font-size="83">Find the role.</text>
    <text x="70" y="370" fill="#0A5975" font-size="83">Go to the employer.</text>
  </g>
  <text x="73" y="426" fill="#56646B" font-family="Outfit, Avenir Next, Arial, sans-serif" font-size="24" font-weight="400">Open-source job discovery. Original application links.</text>

  <g transform="translate(72 518)" font-family="Outfit, Avenir Next, Arial, sans-serif">
    <rect width="234" height="62" rx="14" fill="#E7F1F4"/>
    <circle cx="33" cy="31" r="14" fill="#0A5975"/>
    <path d="M28 31h10m-5-5 5 5-5 5" fill="none" stroke="#FCFDFC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="59" y="39" fill="#0A5975" font-size="19" font-weight="700">OPEN SOURCE</text>
    <text x="265" y="38" fill="#15242B" font-size="21" font-weight="500">See the source. Apply at the source.</text>
  </g>
  <text x="1128" y="556" text-anchor="end" fill="#56646B" font-family="Outfit, Avenir Next, Arial, sans-serif" font-size="17" font-weight="500">github.com/praxelhq/openjobs</text>
</svg>
